<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chobits</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: transparent;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #e2e8f0;
        -webkit-app-region: drag;
        user-select: none;
      }

      /* Static soft glow behind the logo */
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        z-index: -1;
        background: radial-gradient(ellipse at center, rgba(15, 23, 42, 0.85) 0%, rgba(15, 23, 42, 0.4) 45%, transparent 70%);
        pointer-events: none;
      }

      .splash-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }

      .splash-logo {
        width: 220px;
      }

      .splash-status {
        font-size: 12px;
        color: #64748b;
        letter-spacing: 1px;
        min-height: 16px;
      }

      /* Dot loading indicator */
      .loading-dots {
        display: inline-flex;
        gap: 4px;
        margin-left: 4px;
      }

      .loading-dots span {
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: #64748b;
        animation: dotPulse 1.4s ease-in-out infinite;
      }

      .loading-dots span:nth-child(2) {
        animation-delay: 0.2s;
      }

      .loading-dots span:nth-child(3) {
        animation-delay: 0.4s;
      }

      @keyframes dotPulse {
        0%,
        80%,
        100% {
          opacity: 0.3;
          transform: scale(0.8);
        }

        40% {
          opacity: 1;
          transform: scale(1.2);
        }
      }
    </style>
  </head>

  <body>
    <div class="splash-content">
      <img class="splash-logo" src="logo.png" alt="Chobits" />

      <div class="splash-status">
        <span class="loading-dots"> <span></span><span></span><span></span> </span>
      </div>
    </div>
  </body>
</html>
