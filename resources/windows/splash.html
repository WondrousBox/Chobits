<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chobits</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: radial-gradient(ellipse at center, #0a0e1a 0%, rgba(10, 14, 26, 0.92) 15%, rgba(15, 23, 42, 0.6) 30%, rgba(17, 24, 39, 0.2) 48%, rgba(17, 24, 39, 0.05) 62%, transparent 75%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #e2e8f0;
            -webkit-app-region: drag;
            user-select: none;
        }

        /* Subtle color accent overlays */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at 35% 40%, rgba(59, 130, 246, 0.06) 0%, transparent 35%),
                radial-gradient(ellipse at 65% 55%, rgba(168, 85, 247, 0.05) 0%, transparent 35%);
            pointer-events: none;
            z-index: 0;
        }

        .splash-content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 28px;
        }

        /* Core orb container */
        .orb-container {
            position: relative;
            width: 80px;
            height: 80px;
        }

        /* Rotating halo ring */
        .orb-halo {
            position: absolute;
            inset: -12px;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top-color: rgba(99, 102, 241, 0.6);
            border-right-color: rgba(168, 85, 247, 0.3);
            animation: haloSpin 2.5s linear infinite;
        }

        .orb-halo-outer {
            position: absolute;
            inset: -22px;
            border-radius: 50%;
            border: 1px solid transparent;
            border-bottom-color: rgba(59, 130, 246, 0.3);
            border-left-color: rgba(34, 197, 94, 0.2);
            animation: haloSpin 4s linear infinite reverse;
        }

        /* Main spinning cube (from original preload animation) */
        .orb-core {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .orb-core>div {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.9), rgba(168, 85, 247, 0.9));
            border-radius: 8px;
            animation: squareSpin 3s cubic-bezier(0.09, 0.57, 0.49, 0.9) infinite;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.4), 0 0 40px rgba(168, 85, 247, 0.2);
        }

        /* Pulse ring */
        .orb-pulse {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 1px solid rgba(99, 102, 241, 0.3);
            animation: pulseExpand 2s ease-out infinite;
        }

        /* Title */
        .splash-title {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 4px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #94a3b8, #e2e8f0, #94a3b8);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 3s ease-in-out infinite;
        }

        /* Status text */
        .splash-status {
            font-size: 12px;
            color: #64748b;
            letter-spacing: 1px;
            min-height: 16px;
            transition: opacity 0.3s;
        }

        /* Fast-scrolling log line (like archive extraction progress) */
        .splash-log {
            position: fixed;
            bottom: 16px;
            left: 24px;
            right: 24px;
            height: 14px;
            overflow: hidden;
            z-index: 2;
        }

        .splash-log-text {
            font-size: 10px;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            color: rgba(100, 116, 139, 0.7);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: opacity 0.15s;
        }

        .splash-log-text.flash {
            color: rgba(148, 163, 184, 0.9);
        }

        /* Dot loading indicator */
        .loading-dots {
            display: inline-flex;
            gap: 4px;
            margin-left: 4px;
        }

        .loading-dots span {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #64748b;
            animation: dotPulse 1.4s ease-in-out infinite;
        }

        .loading-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .loading-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        /* Floating particles */
        .particles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            border-radius: 50%;
            background: rgba(148, 163, 184, 0.4);
            animation: particleDrift 6s ease-in-out infinite;
        }

        .particle:nth-child(1) {
            left: 15%;
            top: 20%;
            animation-delay: 0s;
            animation-duration: 5s;
        }

        .particle:nth-child(2) {
            left: 75%;
            top: 15%;
            animation-delay: 1s;
            animation-duration: 7s;
        }

        .particle:nth-child(3) {
            left: 40%;
            top: 70%;
            animation-delay: 2s;
            animation-duration: 6s;
        }

        .particle:nth-child(4) {
            left: 85%;
            top: 60%;
            animation-delay: 0.5s;
            animation-duration: 8s;
        }

        .particle:nth-child(5) {
            left: 25%;
            top: 85%;
            animation-delay: 1.5s;
            animation-duration: 5.5s;
        }

        .particle:nth-child(6) {
            left: 60%;
            top: 40%;
            animation-delay: 3s;
            animation-duration: 6.5s;
        }

        /* ── Keyframes ── */

        @keyframes squareSpin {
            25% {
                transform: perspective(100px) rotateX(180deg) rotateY(0);
            }

            50% {
                transform: perspective(100px) rotateX(180deg) rotateY(180deg);
            }

            75% {
                transform: perspective(100px) rotateX(0) rotateY(180deg);
            }

            100% {
                transform: perspective(100px) rotateX(0) rotateY(0);
            }
        }

        @keyframes haloSpin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes pulseExpand {
            0% {
                transform: scale(1);
                opacity: 0.6;
            }

            100% {
                transform: scale(1.8);
                opacity: 0;
            }
        }

        @keyframes shimmer {
            0% {
                background-position: -200% center;
            }

            100% {
                background-position: 200% center;
            }
        }

        @keyframes dotPulse {

            0%,
            80%,
            100% {
                opacity: 0.3;
                transform: scale(0.8);
            }

            40% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        @keyframes particleDrift {

            0%,
            100% {
                transform: translateY(0) translateX(0);
                opacity: 0.3;
            }

            50% {
                transform: translateY(-15px) translateX(8px);
                opacity: 0.7;
            }
        }
    </style>
</head>

<body>
    <!-- Floating particles -->
    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <div class="splash-content">
        <div class="orb-container">
            <div class="orb-halo-outer"></div>
            <div class="orb-halo"></div>
            <div class="orb-core">
                <div></div>
            </div>
            <div class="orb-pulse"></div>
        </div>

        <div class="splash-title">Chobits</div>

        <div class="splash-status">
            <span id="status-text">正在初始化</span>
            <span class="loading-dots">
                <span></span><span></span><span></span>
            </span>
        </div>
    </div>

    <!-- Fast log line at bottom -->
    <div class="splash-log">
        <div class="splash-log-text" id="log-text"></div>
    </div>

    <script>
        // Fast log text updater — brief flash then dim
        const logEl = document.getElementById('log-text');
        let logTimer = null;
        function updateLog(text) {
            if (!logEl) return;
            logEl.textContent = text;
            logEl.classList.add('flash');
            clearTimeout(logTimer);
            logTimer = setTimeout(() => logEl.classList.remove('flash'), 200);
        }
    </script>
</body>

</html>
