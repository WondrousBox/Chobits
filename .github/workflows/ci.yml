name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # 拉取 Git LFS 对象（webm/png/onnx 等二进制资源），否则 checkout 出来的是 LFS 指针文件
          lfs: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # postinstall（electron-builder install-app-deps）会在 Linux 上编译 keytar/uiohook-napi 等原生依赖
      - name: Install Native Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep libsecret-1-dev libx11-dev libxtst-dev libxinerama-dev libxkbcommon-dev libxrandr-dev libxi-dev libxt-dev libx11-xcb-dev libxkbfile-dev

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # e2e（test/misc/e2e.spec.ts）在 Linux 上 skip，无需 xvfb
      - name: Test
        run: pnpm test
