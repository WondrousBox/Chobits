name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '**.spec.js'
      - '.vscode'
      - '.gitignore'
      - '.github/**'
      - '!.github/workflows/build.yml'

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # postinstall（electron-builder install-app-deps）会在 Linux 上编译 keytar/uiohook-napi 等原生依赖
      - name: Install Native Build Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev libx11-dev libxtst-dev libxinerama-dev libxkbcommon-dev

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Platform Resources (macOS)
        if: runner.os == 'macOS'
        run: pnpm run download-7zip-darwin-arm64

      - name: Download Platform Resources (Windows)
        if: runner.os == 'Windows'
        run: pnpm run download-7zip-win32-x64

      - name: Download Platform Resources (Linux)
        if: runner.os == 'Linux'
        run: pnpm run download-7zip-linux-x64

      - name: Build Release Files
        run: pnpm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release_on_${{ matrix.os }}
          path: release/
          retention-days: 5
